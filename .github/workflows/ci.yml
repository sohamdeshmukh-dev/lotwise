name: Quality and PostgreSQL integration
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lotwise
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lotwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lotwise"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lotwise:ci-only@localhost:5432/lotwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks
      - run: pytest -q
      - run: python benchmarks/run.py --accounts 100 --runs 1 --output /tmp/lotwise-benchmark
