[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lotwise"
version = "0.1.0"
description = "Auditable, tax-lot-aware rebalancing for simulated separately managed accounts"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "cvxpy>=1.6,<2", "fastapi>=0.115,<1", "sqlalchemy>=2,<3", "uvicorn>=0.30,<1", "psycopg[binary]>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
lotwise = "lotwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotwise = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
